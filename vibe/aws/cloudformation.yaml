AWSTemplateFormatVersion: "2010-09-09"
Description: >
  VIBE Audio Streaming - k3s Kubernetes Cluster on EC2 (AWS Academy Sandbox Compatible).
  Deploys 1 k3s server (t3.medium) + 3 k3s agents (t3.small) + Classic ELB + S3 Buckets.

Parameters:
  ClusterToken:
    Description: Random shared k3s token generated by setup.sh on first deployment
    Type: String
    NoEcho: true
    AllowedPattern: "[a-f0-9]{64}"
  VpcId:
    Description: Default VPC selected by setup.sh
    Type: AWS::EC2::VPC::Id
  PublicSubnetIds:
    Description: Three public default subnets in different Availability Zones
    Type: List<AWS::EC2::Subnet::Id>
  KeyName:
    Description: Name of an existing EC2 KeyPair for SSH access (vockey in Academy Sandbox)
    Type: String
    Default: vockey
  ServerInstanceType:
    Description: EC2 instance type for k3s server (builds images and runs control plane)
    Type: String
    Default: t3.medium
    AllowedValues: [t3.medium, t2.medium]
  AgentInstanceType:
    Description: EC2 instance type for k3s agents (worker nodes)
    Type: String
    Default: t3.small
    AllowedValues: [t3.small, t3.micro, t2.small, t2.micro]
  LatestAmazonLinuxAmiId:
    Description: SSM Parameter for Amazon Linux 2023 x86_64 (Amazon provided AMI)
    Type: "AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>"
    Default: "/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64"

Conditions:
  HasKeyName: !Not [!Equals [!Ref KeyName, ""]]

Resources:
  # ----------------------------------------------------
  # Security Group
  # ----------------------------------------------------
  ClusterSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for VIBE k3s cluster and nodes
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        # SSH
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        # HTTP / ELB
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        # NodePort range for Ingress / k8s services
        - IpProtocol: tcp
          FromPort: 30000
          ToPort: 32767
          CidrIp: 0.0.0.0/0
        # k3s API
        - IpProtocol: tcp
          FromPort: 6443
          ToPort: 6443
          CidrIp: 0.0.0.0/0
        # K8s Web Viewer (server.py)
        - IpProtocol: tcp
          FromPort: 8085
          ToPort: 8085
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: vibe-k3s-sg

  # Internal communication within Security Group
  ClusterSecurityGroupSelfIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ClusterSecurityGroup
      IpProtocol: "-1"
      SourceSecurityGroupId: !Ref ClusterSecurityGroup

  # ----------------------------------------------------
  # Elastic Load Balancer (Classic ELB)
  # ----------------------------------------------------
  VibeLoadBalancer:
    Type: AWS::ElasticLoadBalancing::LoadBalancer
    Properties:
      SecurityGroups:
        - !Ref ClusterSecurityGroup
      Subnets: !Ref PublicSubnetIds
      Listeners:
        - LoadBalancerPort: "80"
          InstancePort: "30080"
          Protocol: HTTP
          InstanceProtocol: HTTP
      HealthCheck:
        Target: "HTTP:30080/healthz"
        HealthyThreshold: "2"
        UnhealthyThreshold: "5"
        Interval: "10"
        Timeout: "5"
      Instances:
        - !Ref Agent1Instance
        - !Ref Agent2Instance
        - !Ref Agent3Instance
      Tags:
        - Key: Name
          Value: vibe-elb

  # ----------------------------------------------------
  # S3 Buckets for Audio Storage
  # ----------------------------------------------------
  RawAudioBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "vibe-audio-raw-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Project
          Value: vibe

  HlsAudioBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "vibe-audio-hls-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Project
          Value: vibe

  # ----------------------------------------------------
  # EC2 k3s Server (Control Plane + Docker build node)
  # ----------------------------------------------------
  ServerInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref ServerInstanceType
      ImageId: !Ref LatestAmazonLinuxAmiId
      KeyName: !If [HasKeyName, !Ref KeyName, !Ref "AWS::NoValue"]
      IamInstanceProfile: LabInstanceProfile
      NetworkInterfaces:
        - DeviceIndex: "0"
          AssociatePublicIpAddress: true
          SubnetId: !Select [0, !Ref PublicSubnetIds]
          GroupSet: [!Ref ClusterSecurityGroup]
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 20
            VolumeType: gp2
            DeleteOnTermination: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          hostnamectl set-hostname k3s-server
          
          # Install Docker & tools
          dnf install -y docker git jq unzip python3
          systemctl enable --now docker amazon-ssm-agent
          usermod -aG docker ec2-user
          
          # Install AWS CLI v2
          if ! command -v aws >/dev/null; then
            curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
            unzip -q /tmp/awscliv2.zip -d /tmp/vibe-awscli
            /tmp/vibe-awscli/aws/install
          fi
          
          # Install k3s server
          export K3S_TOKEN="${ClusterToken}"
          curl -sfL https://get.k3s.io | sh -s - server \
            --disable traefik \
            --node-name k3s-server \
            --write-kubeconfig-mode 600 \
            --token "$K3S_TOKEN"
            
          # Configure kubeconfig for ec2-user
          install -d -m 700 -o ec2-user -g ec2-user /home/ec2-user/.kube
          install -m 600 -o ec2-user -g ec2-user /etc/rancher/k3s/k3s.yaml /home/ec2-user/.kube/config
          echo "export KUBECONFIG=/home/ec2-user/.kube/config" >> /home/ec2-user/.bashrc
          
          echo "k3s server ready" > /var/log/k3s-ready.log

      Tags:
        - Key: Name
          Value: vibe-k3s-server
        - Key: Role
          Value: k3s-server

  # ----------------------------------------------------
  # EC2 k3s Agents (Worker Nodes)
  # ----------------------------------------------------
  Agent1Instance:
    Type: AWS::EC2::Instance
    DependsOn: ServerInstance
    Properties:
      InstanceType: !Ref AgentInstanceType
      ImageId: !Ref LatestAmazonLinuxAmiId
      KeyName: !If [HasKeyName, !Ref KeyName, !Ref "AWS::NoValue"]
      IamInstanceProfile: LabInstanceProfile
      NetworkInterfaces:
        - DeviceIndex: "0"
          AssociatePublicIpAddress: true
          SubnetId: !Select [0, !Ref PublicSubnetIds]
          GroupSet: [!Ref ClusterSecurityGroup]
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 15
            VolumeType: gp2
            DeleteOnTermination: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          systemctl enable --now amazon-ssm-agent
          hostnamectl set-hostname k3s-agent-1
          export K3S_TOKEN="${ClusterToken}"
          export K3S_URL="https://${ServerInstance.PrivateIp}:6443"
          curl -sfL https://get.k3s.io | K3S_URL="$K3S_URL" K3S_TOKEN="$K3S_TOKEN" sh -s - agent --node-name k3s-agent-1
      Tags:
        - Key: Name
          Value: vibe-k3s-agent-1
        - Key: Role
          Value: k3s-agent

  Agent2Instance:
    Type: AWS::EC2::Instance
    DependsOn: ServerInstance
    Properties:
      InstanceType: !Ref AgentInstanceType
      ImageId: !Ref LatestAmazonLinuxAmiId
      KeyName: !If [HasKeyName, !Ref KeyName, !Ref "AWS::NoValue"]
      IamInstanceProfile: LabInstanceProfile
      NetworkInterfaces:
        - DeviceIndex: "0"
          AssociatePublicIpAddress: true
          SubnetId: !Select [1, !Ref PublicSubnetIds]
          GroupSet: [!Ref ClusterSecurityGroup]
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 15
            VolumeType: gp2
            DeleteOnTermination: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          systemctl enable --now amazon-ssm-agent
          hostnamectl set-hostname k3s-agent-2
          export K3S_TOKEN="${ClusterToken}"
          export K3S_URL="https://${ServerInstance.PrivateIp}:6443"
          curl -sfL https://get.k3s.io | K3S_URL="$K3S_URL" K3S_TOKEN="$K3S_TOKEN" sh -s - agent --node-name k3s-agent-2
      Tags:
        - Key: Name
          Value: vibe-k3s-agent-2
        - Key: Role
          Value: k3s-agent

  Agent3Instance:
    Type: AWS::EC2::Instance
    DependsOn: ServerInstance
    Properties:
      InstanceType: !Ref AgentInstanceType
      ImageId: !Ref LatestAmazonLinuxAmiId
      KeyName: !If [HasKeyName, !Ref KeyName, !Ref "AWS::NoValue"]
      IamInstanceProfile: LabInstanceProfile
      NetworkInterfaces:
        - DeviceIndex: "0"
          AssociatePublicIpAddress: true
          SubnetId: !Select [2, !Ref PublicSubnetIds]
          GroupSet: [!Ref ClusterSecurityGroup]
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 15
            VolumeType: gp2
            DeleteOnTermination: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          systemctl enable --now amazon-ssm-agent
          hostnamectl set-hostname k3s-agent-3
          export K3S_TOKEN="${ClusterToken}"
          export K3S_URL="https://${ServerInstance.PrivateIp}:6443"
          curl -sfL https://get.k3s.io | K3S_URL="$K3S_URL" K3S_TOKEN="$K3S_TOKEN" sh -s - agent --node-name k3s-agent-3
      Tags:
        - Key: Name
          Value: vibe-k3s-agent-3
        - Key: Role
          Value: k3s-agent

Outputs:
  LoadBalancerURL:
    Description: Public URL for VIBE application through ELB
    Value: !Sub "http://${VibeLoadBalancer.DNSName}"
  ServerPublicIP:
    Description: Public IP of the k3s server node
    Value: !GetAtt ServerInstance.PublicIp
  ServerPrivateIP:
    Description: Private IP of the k3s server node
    Value: !GetAtt ServerInstance.PrivateIp
  RawBucketName:
    Description: Name of S3 Raw Audio Bucket
    Value: !Ref RawAudioBucket
  HlsBucketName:
    Description: Name of S3 HLS Audio Bucket
    Value: !Ref HlsAudioBucket
  SSHCommand:
    Description: SSH command to connect to k3s server
    Value: !Sub "ssh -i labsuser.pem ec2-user@${ServerInstance.PublicIp}"
