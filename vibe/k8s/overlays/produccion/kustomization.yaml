apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Producción usa el RDS Multi-AZ de Terraform. El Secret vibe-secrets debe
# aprovisionarse fuera de Git con DATABASE_URL del usuario restringido.
namespace: vibe-produccion
resources:
  - ../../base
  - namespace.yaml
  - ingress.yaml

patches:
  - target:
      version: v1
      kind: Service
      name: postgres
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: postgres
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: postgres
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: postgres
  - target:
      kind: ScaledObject
      name: worker
    patch: |-
      - op: replace
        path: /spec/maxReplicaCount
        value: 8
