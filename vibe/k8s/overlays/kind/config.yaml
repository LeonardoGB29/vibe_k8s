apiVersion: v1
kind: ConfigMap
metadata:
  name: vibe-config
  namespace: vibe
data:
  DATABASE_URL: postgresql+psycopg://vibe:vibe@postgres:5432/vibe
  REDIS_URL: redis://redis:6379/0
  MINIO_ENDPOINT: minio:9000
  MINIO_SECURE: "false"
  BUCKET_RAW: raw
  BUCKET_HLS: hls
  QUEUE_NAME: transcode
  HLS_BITRATES: 64k,128k
  HLS_SEGMENT_SECONDS: "6"
---
apiVersion: v1
kind: Secret
metadata:
  name: vibe-secrets
  namespace: vibe
type: Opaque
stringData:
  POSTGRES_USER: vibe
  POSTGRES_PASSWORD: vibe
  POSTGRES_DB: vibe
  MINIO_ACCESS_KEY: vibeadmin
  MINIO_SECRET_KEY: vibesecret123
