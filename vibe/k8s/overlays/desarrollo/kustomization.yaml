apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# vibe-config y vibe-secrets no están aquí: llevan los buckets reales y credenciales
# temporales, y los crea aws/cluster-init.sh antes de aplicar este overlay.
resources:
  - ../../base
  - namespace.yaml
  - ingress.yaml

patches:
  - target:
      kind: ScaledObject
      name: worker
    patch: |-
      - op: replace
        path: /spec/maxReplicaCount
        value: 2
  # Perfil basico para pruebas de codigo: 1 servidor + 1 agente, sin replicas de sobra.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: "frontend|catalog-api|upload-api|stream-api"
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      group: autoscaling
      version: v2
      kind: HorizontalPodAutoscaler
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
