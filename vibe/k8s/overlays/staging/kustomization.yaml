apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Staging usa el RDS Single-AZ de Terraform. El Secret vibe-secrets debe
# aprovisionarse fuera de Git con DATABASE_URL del usuario restringido.
namespace: vibe-staging
resources:
  - ../../base
  - namespace.yaml
  - ingress.yaml

patches:
  - target:
      version: v1
      kind: Service
      name: postgres
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: postgres
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: postgres
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: postgres
  # Pruebas de carga: mantiene 2 replicas minimas como produccion, pero con techo
  # bajo para caber en 1 servidor + 2 agentes (6 vCPU).
  - target:
      group: autoscaling
      version: v2
      kind: HorizontalPodAutoscaler
    patch: |-
      - op: replace
        path: /spec/maxReplicas
        value: 5
  - target:
      kind: ScaledObject
      name: worker
    patch: |-
      - op: replace
        path: /spec/maxReplicaCount
        value: 5
