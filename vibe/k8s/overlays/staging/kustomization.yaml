apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Staging usa el RDS Single-AZ de Terraform. El Secret vibe-secrets debe
# aprovisionarse fuera de Git con DATABASE_URL del usuario restringido.
namespace: vibe-staging
resources:
  - ../../base
  - namespace.yaml
  - ingress.yaml

patches:
  - target:
      version: v1
      kind: Service
      name: postgres
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: postgres
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: postgres
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: postgres
