# Aplicar DESPUÉS de instalar kube-prometheus-stack.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: catalog-api
  namespace: vibe
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: catalog-api
  endpoints:
    - port: http
      path: /metrics
      interval: 10s
---
