apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Overlay de CI: evita saturar el runner de GitHub Actions con réplicas locales.
resources:
  - ../test

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: catalog-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: upload-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: stream-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
