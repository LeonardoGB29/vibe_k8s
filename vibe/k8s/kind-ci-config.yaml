# Cluster minimo para CI (runner de GitHub: ~4 vCPU / 7 GB). Un solo nodo con ingress.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: vibe
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
