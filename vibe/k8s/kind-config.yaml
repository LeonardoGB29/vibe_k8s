# Cluster local: 1 control-plane + 3 workers.
# Varios workers permiten simular la caída de un nodo y ver la reprogramación de pods.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: vibe
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  - role: worker
  - role: worker
  - role: worker
