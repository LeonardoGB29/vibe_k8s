apiVersion: v1
kind: ConfigMap
metadata:
  name: vibe-config
  namespace: vibe
data:
  DATABASE_URL: postgresql+psycopg://vibe:vibe@postgres:5432/vibe
  REDIS_URL: redis://redis:6379/0
  MINIO_ENDPOINT: s3.us-east-1.amazonaws.com
  MINIO_SECURE: "true"
  AWS_REGION: us-east-1
  BUCKET_RAW: vibe-audio-raw
  BUCKET_HLS: vibe-audio-hls
  QUEUE_NAME: transcode
  HLS_BITRATES: 64k,128k
  HLS_SEGMENT_SECONDS: "6"
---
apiVersion: v1
kind: Secret
metadata:
  name: vibe-secrets
  namespace: vibe
type: Opaque
stringData:
  POSTGRES_USER: vibe
  POSTGRES_PASSWORD: vibe
  POSTGRES_DB: vibe
  # Completar con credenciales temporales del AWS Academy Sandbox si no se usa IAM Role
  MINIO_ACCESS_KEY: ""
  MINIO_SECRET_KEY: ""
  MINIO_SESSION_TOKEN: ""
