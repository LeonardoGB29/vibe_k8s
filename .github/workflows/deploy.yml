name: deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Commit SHA (GHCR tag) to deploy
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-desarrollo
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: desarrollo
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.image_tag }}
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6
      - name: Read Terraform state
        working-directory: vibe/terraform/envs/desarrollo
        run: terraform init -input=false -lockfile=readonly -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      - name: Resolve server instance
        id: server
        run: |
          echo "id=$(terraform -chdir=vibe/terraform/envs/desarrollo output -raw server_instance_id)" >> "$GITHUB_OUTPUT"
          echo "bucket=$(terraform -chdir=vibe/terraform/envs/desarrollo output -raw raw_bucket)" >> "$GITHUB_OUTPUT"
      - name: Deploy with SSM
        env:
          INSTANCE_ID: ${{ steps.server.outputs.id }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          IMAGE_OWNER: ${{ github.repository_owner }}
          RAW_BUCKET: ${{ steps.server.outputs.bucket }}
        run: |
          archive="vibe-${IMAGE_TAG}.tar.gz"
          git archive --format=tar.gz --output="$archive" "$IMAGE_TAG"
          aws s3 cp "$archive" "s3://${RAW_BUCKET}/deployment/${archive}"
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters commands="sudo -iu ec2-user bash -lc 'aws s3 cp s3://${RAW_BUCKET}/deployment/${archive} ~/vibe-deploy.tar.gz && mkdir -p ~/vibe-deploy && tar -xzf ~/vibe-deploy.tar.gz -C ~/vibe-deploy && cd ~/vibe-deploy/vibe && IMAGE_TAG=${IMAGE_TAG} REGISTRY_OWNER=${IMAGE_OWNER,,} bash aws/deploy-ghcr.sh'" \
            --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$INSTANCE_ID"
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
