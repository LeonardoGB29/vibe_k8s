name: deploy

# Despliega en el cluster k3s del entorno elegido (cada entorno tiene el suyo: tag
# vibe-<entorno>-k3s-server, creado por terraform/envs/<entorno>). Autenticacion con la clave del usuario IAM
# github-vibe-deploy (permisos minimos; el proyecto prohibe OIDC). Requiere en cada
# Environment los secretos AWS_ACCESS_KEY_ID y AWS_SECRET_ACCESS_KEY y (opcional) la
# variable AWS_REGION; ver vibe/terraform/README.md.
on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "SHA completo (40 caracteres) del commit a desplegar; la imagen GHCR es sha-<SHA>"
        required: true
        type: string
      target_environment:
        description: Entorno Kubernetes de destino
        required: true
        type: choice
        options:
          - desarrollo
          - staging
          - produccion
  # Lo invoca ci.yml (CD automatico) con el SHA que acaba de pasar el CI en la rama del entorno.
  workflow_call:
    inputs:
      commit_sha:
        required: true
        type: string
      target_environment:
        required: true
        type: string
      # staging y produccion se levantan a demanda: si su clúster esta apagado, el despliegue
      # automatico termina con un aviso en vez de fallar. En el lanzamiento manual siempre falla.
      skip_if_down:
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

# Un despliegue a la vez por entorno (cada entorno tiene su propio cluster).
concurrency:
  group: deploy-${{ inputs.target_environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    env:
      COMMIT_SHA: ${{ inputs.commit_sha }}
      TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
      # El tag que publica ci.yml (docker/metadata-action type=sha,format=long)
      # lleva el prefijo "sha-"; el commit de Git no.
      IMAGE_TAG: sha-${{ inputs.commit_sha }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
    steps:
      - name: Validar el SHA
        run: |
          if [[ ! "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::commit_sha debe ser el SHA completo de 40 caracteres hexadecimales (sin el prefijo sha-)."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
      - name: Verificar que las imagenes existen en GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          owner="${OWNER,,}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for service in frontend catalog-api upload-api stream-api worker; do
            image="ghcr.io/${owner}/vibe_k8s-${service}:${IMAGE_TAG}"
            docker manifest inspect "$image" >/dev/null \
              || { echo "::error::No existe $image. ¿Termino el job image-publish de ese commit?"; exit 1; }
            echo "ok $image"
          done
      - name: Comprobar que los secretos de AWS llegan al job
        env:
          AWS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [[ -z "$AWS_KEY_ID" || -z "$AWS_SECRET" ]]; then
            echo "::error::Faltan AWS_ACCESS_KEY_ID y/o AWS_SECRET_ACCESS_KEY para el Environment '${TARGET_ENVIRONMENT}'. Créalos en Settings > Environments > ${TARGET_ENVIRONMENT} > Environment secrets (cada Environment guarda los suyos; el nombre debe coincidir exactamente) y vuelve a lanzar el workflow."
            exit 1
          fi
          echo "Secretos de AWS presentes para ${TARGET_ENVIRONMENT}."
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Localizar el servidor y comprobar SSM
        id: server
        env:
          SKIP_IF_DOWN: ${{ inputs.skip_if_down }}
        run: |
          account=$(aws sts get-caller-identity --query Account --output text)
          id=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=vibe-${TARGET_ENVIRONMENT}-k3s-server" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          if [[ "$id" == "None" || -z "$id" ]]; then
            if [[ "$SKIP_IF_DOWN" == "true" ]]; then
              echo "::warning::El clúster de ${TARGET_ENVIRONMENT} esta apagado: NO se desplego. El cambio ya esta en la rama. Levanta el entorno (aws/deploy-aws.sh ${TARGET_ENVIRONMENT}) o lanza el workflow deploy con este SHA cuando lo necesites."
              {
                echo "### ⚠️ ${TARGET_ENVIRONMENT}: sin desplegar"
                echo "El servidor \`vibe-${TARGET_ENVIRONMENT}-k3s-server\` no esta encendido. SHA: \`${COMMIT_SHA}\`."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::El servidor k3s de ${TARGET_ENVIRONMENT} no esta encendido. Despliega el entorno con aws/deploy-aws.sh ${TARGET_ENVIRONMENT} o enciende las EC2 (puede haberlas pausado el guardian de creditos)."
            exit 1
          fi
          ping=$(aws ssm describe-instance-information --filters "Key=InstanceIds,Values=$id" \
            --query 'InstanceInformationList[0].PingStatus' --output text)
          if [[ "$ping" != "Online" ]]; then
            echo "::error::El agente SSM de $id no esta Online (estado: $ping)."
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "bucket=vibe-${TARGET_ENVIRONMENT}-audio-raw-${account}" >> "$GITHUB_OUTPUT"
      - name: Deploy with SSM
        if: steps.server.outputs.skip != 'true'
        env:
          INSTANCE_ID: ${{ steps.server.outputs.id }}
          IMAGE_OWNER: ${{ github.repository_owner }}
          RAW_BUCKET: ${{ steps.server.outputs.bucket }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
        run: |
          archive="vibe-${COMMIT_SHA}.tar.gz"
          git archive --format=tar.gz --output="$archive" "$COMMIT_SHA"
          aws s3 cp "$archive" "s3://${RAW_BUCKET}/deployment/${archive}"
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --timeout-seconds 1800 \
            --parameters commands="sudo -iu ec2-user bash -lc 'aws s3 cp s3://${RAW_BUCKET}/deployment/${archive} ~/vibe-deploy.tar.gz && rm -rf ~/vibe-deploy && mkdir -p ~/vibe-deploy && tar -xzf ~/vibe-deploy.tar.gz -C ~/vibe-deploy && cd ~/vibe-deploy/vibe && TARGET_ENVIRONMENT=${TARGET_ENVIRONMENT} IMAGE_TAG=${IMAGE_TAG} REGISTRY_OWNER=${IMAGE_OWNER,,} bash aws/deploy-ghcr.sh'" \
            --query 'Command.CommandId' --output text)
          # `wait` devuelve error si el comando falla; seguimos para mostrar siempre la salida.
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$INSTANCE_ID" || true
          invocation=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --output json)
          echo "$invocation" | jq -r '"Estado: " + .Status + "\n--- STDOUT ---\n" + .StandardOutputContent + "\n--- STDERR ---\n" + .StandardErrorContent'
          [[ "$(echo "$invocation" | jq -r .Status)" == "Success" ]] \
            || { echo "::error::El despliegue fallo (deploy-ghcr.sh restauro la revision anterior si llego a aplicar cambios)."; exit 1; }
      - name: Comprobar la URL publica
        if: steps.server.outputs.skip != 'true'
        run: |
          dns=$(aws elb describe-load-balancers --load-balancer-names vibe-${{ inputs.target_environment }}-elb \
            --query 'LoadBalancerDescriptions[0].DNSName' --output text)
          for path in / /api/stats /api/tracks; do
            curl -fsS --retry 10 --retry-delay 5 --retry-connrefused --retry-all-errors --max-time 15 \
              -o /dev/null -w "$path -> %{http_code}\n" "http://${dns}${path}"
          done
